monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Business channels. Each is autowirable as LoggerInterface $<name>Logger
        # (e.g. $paymentLogger) and is routed to its own handler in prod so a
        # successful business event survives — see the "business" handler below.
        - checkout   # cart -> address -> shipping -> payment funnel
        - payment    # Stripe and PayPal: intents, captures, verification outcomes
        - shipping   # Shippo rate lookups and label data
        - audit      # who changed what in the back-office
        - mail       # transactional email dispatch

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    parameters:
        # Verbosity is an env var so it can be raised on a running deploy without
        # rebuilding the image. The default keeps deploys whose .env predates this
        # variable booting unchanged — the server keeps its own .env, separate
        # from the one in the repo.
        app.log_level_default: 'info'
        app.log_level: '%env(default:app.log_level_default:LOG_LEVEL)%'

    monolog:
        handlers:
            # ── Business events ────────────────────────────────────────────
            # Straight to stderr at info level, deliberately NOT behind
            # fingers_crossed: that handler only flushes when something fails,
            # which means a checkout that *succeeds* would leave no trace and
            # orders could not be counted from logs. This handler is the record
            # of what the business actually did.
            business:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: [checkout, payment, shipping, audit, mail]

            # Same records, also written to disk so the back-office log viewer
            # (/admin/logs) has something to read and download. stderr remains
            # the primary stream — this is a convenience copy, and the
            # container's filesystem is ephemeral: files are lost when the
            # container is replaced, which is why they rotate daily and are
            # capped rather than kept forever.
            business_file:
                type: rotating_file
                path: "%kernel.logs_dir%/business.log"
                max_files: 7
                level: info
                formatter: monolog.formatter.json
                channels: [checkout, payment, shipping, audit, mail]

            app_file:
                type: rotating_file
                path: "%kernel.logs_dir%/app.log"
                max_files: 7
                level: warning
                formatter: monolog.formatter.json
                channels: ["!deprecation", "!event", "!checkout", "!payment", "!shipping", "!audit", "!mail"]

            # ── Technical errors ───────────────────────────────────────────
            # Everything else stays buffered: nothing is written until an error
            # occurs, at which point the preceding records provide the context.
            # `doctrine` is excluded because that buffer would otherwise dump
            # SQL *with bound parameters* — customer emails, addresses, names —
            # into the log store on every error.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!doctrine", "!checkout", "!payment", "!shipping", "!audit", "!mail"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: '%app.log_level%'
                formatter: monolog.formatter.json

            # Doctrine errors still matter — just not the buffered SQL trail.
            doctrine_errors:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json
                channels: [doctrine]

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
