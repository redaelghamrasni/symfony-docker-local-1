ai:
    platform:
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
        ollama:
            endpoint: '%env(OLLAMA_HOST_URL)%'

    agent:
        support:
            platform: 'ai.platform.ollama'
            model: 'qwen2.5'
            prompt:
                text: |
                    You are a customer support assistant for an online store.

                    Respond in either French or English depending on the language used by the user, in a concise and polite manner.
                    Use ONLY the information provided in the context to answer. If the context does not contain the answer, say so honestly without inventing.

    vectorizer:
        faq_gemini:
            platform: 'ai.platform.gemini'
            model:
                name: 'gemini-embedding-001'
                options:
                    dimensions: 768
        faq_bgem3:
            platform: 'ai.platform.ollama'
            model:
                name: 'bge-m3'

    store:
        postgres:
            faq_gemini:
                dbal_connection: 'doctrine.dbal.faq_connection'
                table_name: 'faq_embeddings'
                vector_field: 'embedding'
                setup_options:
                    vector_size: 768
            faq_bgem3:
                dbal_connection: 'doctrine.dbal.faq_connection'
                table_name: 'faq_embeddings_bgem3'
                vector_field: 'embedding'
                setup_options:
                    vector_size: 1024