ai:
    platform:
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
        # Inference Platform configuration
        # see https://github.com/symfony/ai/tree/main/src/platform#platform-bridges

        # openai:
        #    api_key: '%env(OPENAI_API_KEY)%'

    agent:
        # Agent configuration
        # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html

        # default:
        #    platform: 'ai.platform.openai'
        #    model: 'gpt-5-mini'
        #    prompt: |
        #        You are a pirate and you write funny.
        #    tools:
        #        - 'Symfony\AI\Agent\Bridge\Clock\Clock'

    vectorizer:
        faq_embeddings:
            platform: 'ai.platform.gemini'
            model:
                name: 'gemini-embedding-001'
                options:
                    dimensions: 768
    
    store:
        postgres:
            faq:
                dbal_connection: 'doctrine.dbal.faq_connection'
                table_name: 'faq_embeddings'
                vector_field: 'embedding'