ai:
    platform:
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
        ollama:
            endpoint: '%env(OLLAMA_HOST_URL)%'

    agent:
        support:
            platform: 'ai.platform.ollama'
            model: 'qwen2.5'
            prompt:
                # Kept in sync with app.chatbot.system_prompt (config/services.yaml), the single
                # source of truth also used when the agent is rebuilt at runtime for a different
                # model (see App\Command\AskFaqCommand and admin/settings "chatbot.model").
                text: '%app.chatbot.system_prompt%'

    vectorizer:
        faq_gemini:
            platform: 'ai.platform.gemini'
            model:
                name: 'gemini-embedding-001'
                options:
                    dimensions: 768
        faq_bgem3:
            platform: 'ai.platform.ollama'
            model:
                name: 'bge-m3'

    store:
        postgres:
            faq_gemini:
                dbal_connection: 'doctrine.dbal.faq_connection'
                table_name: 'faq_embeddings'
                vector_field: 'embedding'
                setup_options:
                    vector_size: 768
            faq_bgem3:
                dbal_connection: 'doctrine.dbal.faq_connection'
                table_name: 'faq_embeddings_bgem3'
                vector_field: 'embedding'
                setup_options:
                    vector_size: 1024