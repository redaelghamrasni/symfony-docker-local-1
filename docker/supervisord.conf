; Runs php-fpm and nginx as supervised children of PID 1 and takes the
; container down if either dies for good.
;
; Before this, entrypoint.sh started FPM with `php-fpm -D` and exec'd nginx, so
; FPM ended up reparented to nginx with nothing watching it: if FPM died, nginx
; kept answering 502s and the container still reported itself healthy. That is
; exactly the failure an operator needs to hear about immediately.

[supervisord]
nodaemon = true
user = root
pidfile = /run/supervisord.pid
logfile = /dev/stdout
logfile_maxbytes = 0
loglevel = info

[program:php-fpm]
command = php-fpm -F
priority = 10
autostart = true
autorestart = true
startretries = 3
stopsignal = QUIT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
startretries = 3
stopsignal = QUIT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; When a program exits or gives up restarting, signal supervisord to shut down
; so the container exits and `--restart unless-stopped` can react.
; /bin/sh only — this image is Alpine and has no bash.
[eventlistener:die_on_fatal]
command = /bin/sh -c "printf 'READY\n'; while read -r line; do kill -QUIT $PPID; done"
events = PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
autostart = true
autorestart = unexpected
