worker_processes auto;
# stderr, not a file inside the container: /var/log/nginx/*.log is invisible to
# `docker logs` and dies with the container.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    # One JSON object per request. PHP-FPM's own access log only ever reports
    # "GET /index.php" — every URL looks identical there — so this is the only
    # place the real path, status and timing of a request are recorded.
    # `request_id` is generated here and passed to PHP below, so an access line
    # and its application log lines can be tied together.
    # `upstream_time` is how long PHP took, which separates "PHP is slow" from
    # "nginx is waiting on something else".
    #
    # `path` uses $request_uri — the original request line. $uri would be the
    # path *after* try_files rewrites it, i.e. "/index.php" for every page,
    # which is exactly the blind spot FPM's own access log has. `route` keeps
    # the rewritten value, which is occasionally useful for debugging rewrites.
    log_format json_access escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"route":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"ip":"$remote_addr"'
        '}';

    access_log /dev/stdout json_access;

    # ── Behind Cloudflare ──────────────────────────────────────────────────
    # Without this, $remote_addr is a Cloudflare edge IP, so every access log
    # line — and any future rate limiting — would see Cloudflare instead of the
    # visitor. These are Cloudflare's published ranges; refresh them with:
    #   curl https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
    # Harmless before Cloudflare is in front: traffic from other sources is
    # simply not rewritten.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Tell PHP the original request was HTTPS when Cloudflare says so, so
    # Symfony generates https:// URLs and marks session cookies secure.
    # Setting HTTPS directly avoids having to maintain a trusted-proxy IP list
    # inside the application as well as here.
    map $http_x_forwarded_proto $fcgi_https {
        default   '';
        https     'on';
    }

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Echo the id back so a browser-side error report can name the exact
        # server-side request it came from.
        add_header X-Request-ID $request_id always;

        # Assets statiques
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # Always nginx's own id, never a client-supplied X-Request-ID:
            # callers must not choose the key our logs are indexed on.
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
            # Empty (and therefore absent to PHP) unless Cloudflare reported
            # the visitor's connection as HTTPS.
            fastcgi_param HTTPS $fcgi_https if_not_empty;
            fastcgi_read_timeout 60;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
