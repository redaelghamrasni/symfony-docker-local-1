; PHP-FPM overrides. Copied to /usr/local/etc/php-fpm.d/zz-app.conf so it loads
; after the image's own docker.conf / zz-docker.conf and wins on repeated keys.
;
; Log forwarding is deliberately NOT set here. The official php:*-fpm image
; already ships docker.conf with:
;     error_log = /proc/self/fd/2      access.log = /proc/self/fd/2
;     catch_workers_output = yes       decorate_workers_output = no
; so worker output — including everything Monolog writes to php://stderr —
; already reaches `docker logs`. Verified on the running container 2026-09-23;
; repeating those keys here would only invite drift from the base image.

[www]
; ── Worker sizing ──────────────────────────────────────────────────────────
; Box: 2 vCPU, ~900 MB RAM, shared with redis / rabbitmq / meilisearch / mysql
; / the messenger worker. Memory is the binding constraint, not CPU: a worker
; may grow to memory_limit (256M, docker/php.ini), so the pool stays small.
; 5 is also the image default — restated here so it reads as a decision rather
; than an inherited value. Raising it calls for a bigger instance, not a bigger
; number; measure real usage first with:  ps -o rss,args -C php-fpm
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Recycle workers so a slow leak can't accumulate across a long uptime.
pm.max_requests = 500

; ── Visibility ─────────────────────────────────────────────────────────────
; Any request past 5s gets its PHP stack trace written to the container log —
; this is what tells you *where* a slow checkout is stuck, not just that it was.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
; Hard stop for a wedged request; mirrors max_execution_time in docker/php.ini.
request_terminate_timeout = 60s
