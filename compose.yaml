services:
###> doctrine/doctrine-bundle ###
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony_database
      MYSQL_USER: symfony_user
      MYSQL_PASSWORD: reda1234
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "symfony_user", "--password=reda1234"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "3307:3306"
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
###< symfony/mailer ###

###> redis ###
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
###< redis ###

###> meilisearch ###
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: changeme_master_key_dev
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
###< meilisearch ###

###> pgvector ###
  faq_database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: faq_search
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - faq_database_data:/var/lib/postgresql/data
###< pgvector ###

  ###> rabbitmq ###
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # port AMQP (utilisé par l'app)
      - "15672:15672" # interface web de gestion
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  ###< rabbitmq ###

###> messenger worker ###
  worker:
    build: .
    depends_on:
      - rabbitmq
      - database
      - redis
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      # Each DOCKER_* var lets an environment point the worker at compose services instead of
      # the host-oriented defaults; unset (as on AWS, where .env already holds RDS/real hosts)
      # it falls back to that environment's own .env value.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      MEILI_ENDPOINT: ${DOCKER_MEILI_ENDPOINT:-${MEILI_ENDPOINT}}
      MAILER_DSN: ${DOCKER_MAILER_DSN:-${MAILER_DSN}}
    # The image entrypoint boots php-fpm + nginx for the web container; the worker only consumes.
    entrypoint: ["php", "bin/console"]
    command: messenger:consume async --time-limit=3600 --memory-limit=128M -v
    restart: unless-stopped
###< messenger worker ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

###> redis ###
  redis_data:
###< redis ###

###> meilisearch ###
  meili_data:
###< meilisearch ###

###> pgvector ###
  faq_database_data:
###< pgvector ###
